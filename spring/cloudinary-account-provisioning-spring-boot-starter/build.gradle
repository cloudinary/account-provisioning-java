description = 'cloudinary-account-provisioning Spring Boot Starter'

// Publishing configuration overrides
ext {
    publishingConfig = [
        groupId: rootProject.group,
        artifactId: 'cloudinary-account-provisioning-spring-boot-starter',
        version: rootProject.version,
        name: 'Cloudinary Account Provisioning Java SDK - Spring Boot Starter',
        description: 'Spring Boot starter for the Cloudinary Account Provisioning Java SDK.',
    ]
}

dependencies {
    api project(':')
    api project(':cloudinary-account-provisioning-spring-boot-autoconfigure')
    api "org.springframework.boot:spring-boot-starter:${rootProject.springBootVersion}"
}

jar {
    dependsOn 'generatePomFileForMavenPublication'
    archiveBaseName = 'cloudinary-account-provisioning-spring-boot-starter'
    into("META-INF/maven/com.cloudinary.account.provisioning/cloudinary-account-provisioning-spring-boot-starter") {
        from(layout.buildDirectory.file("pom.xml")) {
            // Only include if it exists to avoid build ordering issues
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }
}